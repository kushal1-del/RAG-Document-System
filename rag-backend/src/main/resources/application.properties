spring.application.name=RAG

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ragdb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

gemini.api.key=${GEMINI_API_KEY}

qdrant.host=${QDRANT_HOST:localhost}
qdrant.port=${QDRANT_PORT:6334}
qdrant.collection.name=documents

jwt.secret=${JWT_SECRET}
jwt.expiration.ms=86400000

# Logging configuration
logging.level.root=INFO
logging.level.com.kushal.rag=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n

# Gemini model configuration
gemini.embedding.model=gemini-embedding-001
gemini.embedding.dimensions=768
gemini.chat.model=gemini-3.6-flash

# RAG search configuration
rag.search.default-limit=5

# Pagination defaults
pagination.default-page-size=20

# Rate limiting: registration endpoint
rate-limit.register.capacity=5
rate-limit.register.refill-minutes=60

# File upload size limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-http-form-post-size=25MB

# Embedding batching (throughput improvement, NOT a quota bypass 
# each text still counts against Gemini's daily/per-minute quota)
gemini.embedding.batch-size=1
embedding.concurrency=1

# Chunking  target size scales up automatically for very large
# documents, to reduce total embedding calls (see TextChunker)
chunking.target-size=1000
chunking.overlap-sentences=2
chunking.large-doc-char-threshold=200000
chunking.large-doc-target-size=2500
#chunking.large-doc-char-threshold=5000
#chunking.large-doc-target-size=2500

# API-key encryption
# Set this through an environment variable in real deployments.
app.encryption.secret=${APP_ENCRYPTION_SECRET}



